workflows:
  android-apk:
    name: Banking Demo Android APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          cd Banking
          flutter pub get

      - name: Create Android platform
        script: |
          cd Banking
          flutter create --platforms=android .

      - name: Build release APK
        script: |
          cd Banking
          flutter build apk --release

    artifacts:
      - Banking/build/app/outputs/flutter-apk/*.apk